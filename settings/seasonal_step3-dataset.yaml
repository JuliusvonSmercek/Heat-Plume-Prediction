# Config for converted DaRUS full_dataset (step-3 scaled domain, 2560x2560).
# Convert with: python -m code.convert_npz_dataset --src datasets/full_dataset-raw --out datasets/full_dataset
# Physical params / injection cycle: 10×73 samples/year (+ wrap), ambient=10 C,
# abs T ≈ [4.998, 15.002] C, flow_scale=0.0005 (see conversion_info.yaml).
# Step2 sample counts kept low: many injection wells per RUN (up to ~2300).
# datapoints are 0-based indices into sorted RUN_* ids (not raw Sim IDs).
run_configuration:
  run_name: full_dataset
  dataset: full_dataset
  seed: 2406
  device: cuda:1
  use_velocity_model: false

  pipeline:
    # - clean: results-step1
    # - step1: train
    - clean: results-step2
    - step2: run
    - clean: results-step3
    - step3: train

general_configuration:
  step1:
    datapoints:
      train: [0]
      validation: [1]
      test: [2]
    general:
      epochs: 1
      visualize: true  # full 2560² fields OOM on A100-40GB during viz/val batches
      visualize_epochs: true
    scheduler:
      type: ReduceLROnPlateau
      init_lr: 1e-4
      mode: min
      factor: 0.2
      patience: 10
      threshold: 1e-3
      min_lr: 1e-6
    model_parameters:
      network: unet
      inputs: [p, k, i]
      outputs: [x, y]
      batchsize: 20
      kernel_size: 5
      depth: 4
      init_features: 32
      stride: 1
      dilation: 1
      norm: batchnorm
      repeat_inner: false
      skip_per_dir: 16
      len_box: 256
      train_loss: MSE
      bool_cutouts: true
      optimizer_switch: false
      optimizer: Adam
      activation: ReLU

  step2:
