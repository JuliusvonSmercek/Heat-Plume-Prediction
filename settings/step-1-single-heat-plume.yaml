# Config for the converted DaRUS step-1-single-heat-plume dataset.
# Convert NPZ -> RUN_*/pflotran.h5 with: python code/convert_npz_dataset.py
# Injection profiles from temperature_injection_series.csv / normed_flow_injection_series.csv
# (1-year cycle from series year 8 = strongest seasonal swing; dt = 18.25 d = 0.05 y).
# Normed flow scaled by 0.0005 -> m^3/s; temp = ambient(10) + ΔT; spread = 5.0015006.
run_configuration:
  run_name: seasonal_new_dataset
  dataset: step-1-single-heat-plume
  seed: 2406
  device: cuda:1
  use_velocity_model: false

  pipeline:
    # - clean: data_prep
    - clean: results-step1
    - step1: train
    - clean: results-step2
    - step2: run
    - clean: results-step3
    - step3: train

general_configuration:
  step1:
    datapoints:
      train: [0, 1, 2, 3, 4]
      validation: [5, 6, 7]
      test: [8, 9, 10]
    general:
      visualize: true
      visualize_epochs: true
    training:
      epochs: 1
      scheduler: ReduceLROnPlateau
      init_lr: 1e-4
      weight_decay: 0.05
      mode: min
      factor: 0.2
      patience: 10
      early_stop_patience_multiplier: 2
      threshold: 1e-3
      min_lr: 1e-6
    model_parameters:
      network: unet
      inputs: [p, k, i]
      outputs: [x, y]
      batchsize: 20
      kernel_size: 5
      depth: 4
      init_features: 32
      stride: 1
      dilation: 1
      norm: batchnorm
      repeat_inner: false
      skip_per_dir: 16
      len_box: 100
      train_loss: MSE
      bool_cutouts: true
      optimizer_switch: false
      optimizer: Adam
      activation: ReLU

  step2:
    general:
      visualize: true
      samples: 5000
      max_steps_per_day: 0.27
    physical_parameters:
      duration_years: 10.0
      thickness_aquifer_m: 1.0
      longitudinal_dispersivity_m: 1.0
      transverse_dispersivity_h_m: 0.1
      include: ./physical_parameters-seasonal-10_0C.yaml

  step3:
    datapoints:
      train: [0, 1, 2, 3]
      validation: [4, 5, 6, 7]
      test: [8, 9, 10]
    general:
      visualize: true
      visualize_epochs: true
    training:
      epochs: 5
      scheduler: ReduceLROnPlateau
      init_lr: 1e-3
      weight_decay: 0.05
      mode: min
      factor: 0.2
      patience: 10
      early_stop_patience_multiplier: 2
      threshold: 1e-3
      min_lr: 1e-6
    model_parameters:
      network: unet
      inputs: [p, k, i, x, y, 7]
      outputs: [t]
      batchsize: 20
      kernel_size: 3
      depth: 3
      init_features: 64
      stride: 1
      dilation: 1
      norm: batchnorm # instancenorm, groupnorm
      repeat_inner: false
      skip_per_dir: 8
      len_box: 256
      train_loss: Huber
      bool_cutouts: true
      optimizer_switch: false
      optimizer: AdamW
      activation: LeakyReLU

paths:
  datasets_raw: ../../datasets
  datasets_prep: ./datasets_prep
  results: ./results
