# Minimal seasonal smoke config (1 epoch, 2 RUNs, tiny streamlines).
# Prep expects tests/heatplume_seasonal_smoke/datasets/seasonal
# with RUN_0, RUN_1 (+ inputs/, settings.yaml) — created by the unittest helper.
run_configuration:
  run_name: seasonal_smoke
  dataset: seasonal
  seed: 2406
  device: cpu
  use_velocity_model: false

  pipeline:
    - clean: data_prep
    - clean: results-step1
    - clean: results-step2
    - step1: train
    - step2: run
    - clean: results-step3
    - step3: train

general_configuration:
  step1:
    datapoints:
      train: [0]
      validation: [1]
      test: [1]
    general:
      visualize: false
      visualize_epochs: false
    training:
      epochs: 1
      scheduler: ReduceLROnPlateau
      init_lr: 1e-4
      weight_decay: 0.05
      mode: min
      factor: 0.2
      patience: 10
      early_stop_patience_multiplier: 2
      threshold: 1e-3
      min_lr: 1e-6
    model_parameters:
      network: unet
      inputs: [p, k, i]
      outputs: [x, y]
      batchsize: 1
      kernel_size: 5
      depth: 2
      init_features: 8
      stride: 1
      dilation: 1
      norm: batchnorm
      repeat_inner: false
      skip_per_dir: 16
      len_box: 256
      train_loss: MSE
      bool_cutouts: false
      optimizer_switch: false
      optimizer: Adam
      activation: ReLU

  step2:
    general:
      visualize: true
      samples: 8
      max_steps_per_day: 0.0004
    physical_parameters:
      duration_years: 27.5
      thickness_aquifer_m: 1.0
      longitudinal_dispersivity_m: 1.0
      transverse_dispersivity_h_m: 0.1
      include: ./physical_parameters-seasonal-10_6C.yaml

  step3:
    datapoints:
      train: [0]
      validation: [1]
      test: [1]
    general:
      visualize: false
      visualize_epochs: false
    training:
      epochs: 1
      scheduler: ReduceLROnPlateau
      init_lr: 1e-3
      weight_decay: 0.05
      mode: min
      factor: 0.2
      patience: 10
      early_stop_patience_multiplier: 2
      threshold: 1e-3
      min_lr: 1e-6
    model_parameters:
      network: unet
      inputs: [p, k, i, x, y, 7]
      outputs: [t]
      batchsize: 1
      kernel_size: 3
      depth: 2
      init_features: 8
      stride: 1
      dilation: 1
      norm: batchnorm
      repeat_inner: false
      skip_per_dir: 8
      len_box: 256
      train_loss: Huber
      bool_cutouts: false
      optimizer_switch: false
      optimizer: AdamW
      activation: LeakyReLU

paths:
  datasets_raw: ../../datasets
  datasets_prep: ./datasets_prep
  results: ./results