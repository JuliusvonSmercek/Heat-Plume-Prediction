# Config for the converted DaRUS step-1-single-heat-plume dataset.
# Convert NPZ -> RUN_*/pflotran.h5 with: python code/convert_npz_dataset.py
# Injection profiles from temperature_injection_series.csv / normed_flow_injection_series.csv
# (1-year cycle from series year 8 = strongest seasonal swing; dt = 18.25 d = 0.05 y).
# Normed flow scaled by 0.0005 -> m^3/s; temp = ambient(10) + ΔT; spread = 5.0015006.
run_configuration:
  run_name: seasonal_new_dataset
  dataset: step-1-single-heat-plume
  seed: 2406
  device: cuda:1
  use_velocity_model: false

  pipeline:
    # - clean: data_prep
    - clean: results-step1
    - step1: train
    - clean: results-step2
    - step2: run
    - clean: results-step3
    - step3: train

general_configuration:
  step1:
    datapoints:
      train: [0, 1, 2, 3, 4]
      validation: [5, 6, 7]
      test: [8, 9, 10]
    general:
      epochs: 1
      visualize: true
      visualize_epochs: true
    scheduler:
      type: ReduceLROnPlateau
      init_lr: 1e-4
      mode: min
      factor: 0.2
      patience: 10
      threshold: 1e-3
      min_lr: 1e-6
    model_parameters:
      network: unet
      inputs: [p, k, i]
      outputs: [x, y]
      batchsize: 20
      kernel_size: 5
      depth: 4
      init_features: 32
      stride: 1
      dilation: 1
      norm: batchnorm
      repeat_inner: false
      skip_per_dir: 16
      len_box: 100
      train_loss: MSE
      bool_cutouts: true
      optimizer_switch: false
      optimizer: Adam
      activation: ReLU

  step2:
    rwpt:
      samples: 5000
      steps: 1000
    physical_parameters:
      resolution_m: 1.9960906958561375  # cell size along long axis (DaRUS res_y) after transpose
      duration_years: 10.0
      porosity_frac: 0.25
      rock_density_kg_per_m3: 2800.0
      rock_specific_heat_J_per_kgK: 2000.0
      water_density_kg_per_m3: 1000.0
      water_specific_heat_J_per_kgK: 4180.0
      thermal_conductivity_dry_W_per_mK: 0.65
      thermal_conductivity_wet_W_per_mK: 1.0
      thickness_aquifer_m: 1.0
      longitudinal_dispersivity_m: 1.0
      transverse_dispersivity_h_m: 0.1
      ambient_temperature_C: 10.0
      temperature_spread_C: 5.0015006
