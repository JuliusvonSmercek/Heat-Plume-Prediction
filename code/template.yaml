          0.98630: 0.0014145377053988591
          1.00000: 0.0014145377053988591

  step3:
    datapoints:                             # Datapoint indices for training phase
      validation: 0
      test: 0
      train: [0]                            # Note: Single datapoint for training (likely overfitting test)
    general:
      epochs: 300
      visualize: true
      visualize_interval: 300
      model_path: temperature_model
    scheduler:
      type: ReduceLROnPlateau
      mode: min
      init_lr: 0.01
      factor: 0.2
      patience: 30
      threshold: 1e-3
      min_lr: 1e-6
    # scheduler:                            # Alternative StepLR settings
    #   type: StepLR
    #   init_lr: 0.01
    #   step_size: 100
    #   gamma: 0.1
    model_parameters:
      network: unet
      inputs: [p, k, i, x, y, 1, 2, 3, 5, 7] # Inputs: Physical fields + Integers (Time lags/features)
      outputs: [t]                           # Output: Temperature field
      batchsize: 20
      kernel_size: 5
      depth: 5
      init_features: 128
      stride: 1
      dilation: 1
      norm: batchnorm
      repeat_inner: false
      skip_per_dir: 8
      len_box: 400
      train_loss: MAE
      bool_cutouts: true
      optimizer_switch: false
      optimizer: Adam
      lr: 0.001
      activation: ReLU
    # model_parameters:                     # Alternative RNN architecture (commented out)
    #   network: rnn
    #   inputs: [p, k, i, x, y, 1, 2, 3, 5, 7]
    #   outputs: [t]
    hopt_parameters:                        # Hyperparameter optimization config for Step 3
      network: [unet]
      inputs: [[k, i, x, y, 1, 2, 3, 5, 7]]
      outputs: [[t]]
      batchsize: [2, 4, 8, 16]
      kernel_size: [3, 5, 7]
      depth: [4, 5, 6, 7]
      init_features: [4, 8, 16, 32, 64]
      stride: [1, 2]
      dilation: [1, 2, 4]
      norm: [batchnorm, groupnorm, None]
      repeat_inner: [True, False]
      skip_per_dir: [64, 32, 16, 8]
      len_box: [1280, 640, 320, 160]
      train_loss: [MSE, MAE]
      bool_cutouts: [True, False]
      optimizer_switch: [True, False]
      optimizer: [Adam, SGD]
      lr: [0.001, 0.0005, 0.0001, 0.00005]
      activation: [ReLU, Tanh, Sigmoid, LeakyReLU]

paths:
  datasets_raw: ../datasets                 # Directory containing raw input data
  datasets_prep: ../datasets_prep           # Directory for preprocessed intermediate data
  results: ../results                       # Output directory for logs, models, and predictions
