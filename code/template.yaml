run_configuration:
  run_name: paper-results-seasonal          # Name of the current experiment run
  dataset: seasonal_heating_cooling         # Identifier for the dataset to load
  seed: 2406                                # Random seed to ensure reproducible results
  device: cuda:1                            # Compute device ('cpu', 'cuda:0', 'cuda:1', etc.)
  use_velocity_model: false                 # If true, skips Step 1 training and loads a pre-trained velocity model
  overfit: false                            # Enable overfitting mode
  overfit_on: 1                     # Number of datapoints to overfit on

  pipeline:                                 # Sequence of execution steps
    - clean: data_prep                      # Cleans data preparation cache
    - clean: results-step1                  # Cleans results from step 1
    - clean: results-step2                  # Cleans results from step 2
    - clean: results-step3                  # Cleans results from step 3 before running
    # - step1: train                        # Train velocity model [options: hopt, test, train, finetune]
    # - step2: run                          # Execute physics simulation [options: run]
    - step3: train                          # Train temperature model [options: hopt, test, train, finetune]

general_configuration:
  step1:
    datapoints:                             # Data indices selection
      validation: [0]                       # List of indices for validation sample
      test: [1]                             # List of indices for test sample
      train: [2]                            # List of indices for training samples
    general:
      epochs: 20                            # Number of training cycles
      visualize: true                       # Enable generation of plot/visualizations during training
      visualize_interval: 500
      model_path: velocity_model            # Directory/name to save the trained model
    scheduler:                              # Learning rate scheduler configuration
      type: ReduceLROnPlateau               # Scheduler type
      init_lr: 0.01                         # Initial learning rate
      mode: min                             # Minimize the monitored metric
      factor: 0.2                           # Factor by which LR is reduced
      patience: 30                          # Epochs to wait before reducing LR
      threshold: 1e-3                       # Threshold for measuring new optimum
      min_lr: 1e-6                          # Lower bound for learning rate
    # scheduler:                            # Alternative StepLR configuration (commented out)
    #   init_lr: 0.01
    #   type: StepLR
    #   step_size: 100
    #   gamma: 0.1
    model_parameters:                       # Neural Network configuration
      network: unet                         # Architecture type
      inputs: [p, k, i]                     # Input channels (Pressure, Permeability, Injection)
      outputs: [x, y]                       # Output channels (Velocity X, Velocity Y)
      batchsize: 20                         # Training batch size
      kernel_size: 5                        # Convolution kernel size
      depth: 4                              # Depth of the U-Net (number of downsampling layers)
      init_features: 32                     # Number of filters in the first layer
      stride: 1                             # Convolution stride
      dilation: 1                           # Convolution dilation rate
      norm: batchnorm                       # Normalization layer type
      repeat_inner: false                   # Repeat inner layers flag
      skip_per_dir: 16                      # Skip connections per direction
      len_box: 256                          # Spatial dimension (box length)
      train_loss: MSE                       # Loss function (Mean Squared Error)
      bool_cutouts: true                    # Enable cutout data augmentation
      optimizer_switch: false               # Toggle to switch optimizers mid-training
      optimizer: Adam                       # Optimizer type
      lr: 0.0001                            # Learning rate for optimizer
      activation: ReLU                      # Activation function
    hopt_parameters:                        # Hyperparameter Optimization search space
      network: [unet]
      inputs: [[p, k, i]]
      outputs: [[x, y]]
      batchsize: [2, 4, 8, 16]
      kernel_size: [3, 5, 7]
      depth: [4, 5, 6, 7]
      init_features: [4, 8, 16, 32, 64]
      stride: [1, 2]
      dilation: [1, 2, 4]
      norm: [batchnorm, groupnorm, None]
      repeat_inner: [True, False]
      skip_per_dir: [64, 32, 16, 8]
      len_box: [1280, 640, 320, 160]
      train_loss: [MSE, MAE]
      bool_cutouts: [True, False]
      optimizer_switch: [True, False]
      optimizer: [Adam, SGD]
      lr: [0.001, 0.0005, 0.0001, 0.00005]
      activation: [ReLU, Tanh, Sigmoid, LeakyReLU]

  step2:
    streamlines:                            # Streamline tracing configuration
      samples: 10000                        # Number of particles/samples
      steps: 5000                           # Max steps for tracing
      diffusion_scale: 0.05                 # Scale factor for diffusion random walk
      diffusion_base: 1.8                   # Base diffusion coefficient
    directsolver:                           # Direct numerical solver settings
      samples: 75000
      steps: 5000
    physical_parameters:                    # Constants defining the physical environment
      resolution_m: 5.0                     # Grid resolution in meters
      duration_years: 25                    # Total simulation duration
      porosity_frac: 0.25                   # Soil/Rock porosity fraction
      rock_density_kg_per_m3: 2800.0        # Density of the solid matrix
      rock_specific_heat_J_per_kgK: 2000.0  # Specific heat capacity of rock
      water_density_kg_per_m3: 1000.0       # Density of the fluid
      water_specific_heat_J_per_kgK: 4180.0 # Specific heat capacity of water
      thermal_conductivity_dry_W_per_mK: 0.65
      thermal_conductivity_wet_W_per_mK: 1.0
      thickness_aquifer_m: 1.0              # Aquifer vertical thickness
      longitudinal_dispersivity_m: 1.0      # Dispersivity along flow direction
      transverse_dispersivity_h_m: 0.1      # Dispersivity perpendicular to flow
      ambient_temperature_C: 10.6           # Background temperature
      
      # Time-variant Injection Temperature Profile
      injection_temperature_C:
        time_unit: year
        values:                             # Key: Time fraction (year), Value: Temp (C)
          0.00000: 5.6
          0.02740: 5.6
          0.05479: 5.6
