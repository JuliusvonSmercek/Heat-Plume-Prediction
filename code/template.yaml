          0.98630: 5.6
          1.00000: 5.6

      # Time-variant Injection Rate Profile
      injection_rate_m3_per_s:
        time_unit: year
        values:                             # Key: Time fraction (year), Value: Flow rate (m3/s)
          0.00000: 0.0013300686453449914
          0.02740: 0.0013381589703715733
          0.05479: 0.0014426100029950762
          0.08219: 0.0013013673920304952
          0.10959: 0.0010032388263792999
          0.13699: 0.0008635786471559158
